## REST Assured Advanced Framework Configuration
## Environment: qa | staging | prod

base.url=https://reqres.in
base.path=/api
environment=qa

## Timeouts (milliseconds)
connection.timeout=10000
socket.timeout=10000

## Logging
log.request=true
log.response=true

## Contract Testing
schema.validation.enabled=true

## Retry Configuration
retry.count=3
retry.delay.ms=1000

## Authentication (set via environment variable or here)
# auth.token=your-token-here
